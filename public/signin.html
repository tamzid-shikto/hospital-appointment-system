<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | MedCore</title>

    <link rel="stylesheet" href="signin.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <span class="logo-icon">+</span>
            <span>medcore</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-actions">
            <a href="appointment.html" class="get-started">
                Get Started
            </a>
        </div>

    </header>


    <!-- Sign In Section -->
    <main class="signin-page">

        <div class="signin-card">

            <div class="signin-heading">

                <span class="eyebrow">Welcome back</span>

                <h1>
                    Sign in to
                    <em>MedCore</em>
                </h1>

                <p>
                    Access your appointments and manage your
                    healthcare information.
                </p>

            </div>


            <form id="signinForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="remember">

                    <label>
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                </div>


                <button type="submit" class="signin-button">
                    Sign In
                    <span>→</span>
                </button>

            </form>


            <div class="divider">
                <span>or</span>
            </div>


            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>


            <p class="appointment-text">
                Need an appointment?
                <a href="appointment.html">
                    Book one here
                </a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 MedCore. All rights reserved.
        </p>

    </footer>

    <script>
    const signinForm = document.getElementById("signinForm");

    signinForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch(
                "https://hospital-appointment-system-cpyl.onrender.com/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );

            const result = await response.json();

            if (response.ok) {
    window.location.replace(
    "http://127.0.0.1:5500/public/index.html"
);

    console.log("Login response:", result);

    localStorage.setItem("userId", result.data.userId);
    localStorage.setItem("token", result.data.token);
} else {
                alert(result.message || "Login failed.");
            }

        } catch (error) {
            console.error("Login error:", error);
            alert("Unable to connect to the server.");
        }
    });
</script>

</body>

</html>
