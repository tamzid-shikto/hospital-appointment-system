<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | MedCore</title>

    <link rel="stylesheet" href="signin.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <span class="logo-icon">+</span>
            <span>medcore</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="doctors.html">Doctors</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-actions">
            <a href="appointment.html" class="get-started">
                Get Started
            </a>
        </div>

    </header>


    <!-- Sign Up Section -->
    <main class="signin-page">

        <div class="signin-card">

            <div class="signin-heading">

                <span class="eyebrow">Create your account</span>

                <h1>
                    Join
                    <em>MedCore</em>
                </h1>

                <p>
                    Create an account to manage your
                    appointments and healthcare information.
                </p>

            </div>


            <form id="signupForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button type="submit" class="signin-button">
                    Create Account
                    <span>→</span>
                </button>

            </form>


            <div class="divider">
                <span>or</span>
            </div>


            <p class="signup-text">
                Already have an account?
                <a href="signin.html">Sign in</a>
            </p>


            <p class="appointment-text">
                Need an appointment?
                <a href="appointment.html">
                    Book one here
                </a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 MedCore. All rights reserved.
        </p>

    </footer>


    <!-- SIGN UP API -->
    <script>

        const signupForm =
            document.getElementById("signupForm");


        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;


                try {

                    const response = await fetch(
                        "https://hospital-appointment-system-cpyl.onrender.com/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );


                    const result =
                        await response.json();


                    console.log(
                        "Registration response:",
                        JSON.stringify(result, null, 2)
                    );


                    if (response.ok) {

                        alert(
                            "Account created successfully!"
                        );

                        window.location.href =
                            "signin.html";

                    } else {

                        alert(
                            result.message ||
                            "Registration failed."
                        );

                    }


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    alert(
                        "Unable to connect to the server."
                    );

                }

            }
        );

    </script>

</body>

</html>
